<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#101115"/>
  <g transform="translate(400, 250)">
    <!-- Abstract neural network nodes mapped to typographic glyph stems -->
    <text x="0" y="40" text-anchor="middle" font-family="serif" font-size="160" font-weight="900" fill="none" stroke="#252836" stroke-width="2">Я</text>
    <text x="0" y="40" text-anchor="middle" font-family="serif" font-size="160" font-weight="900" fill="#0047FF" opacity="0.3">Я</text>
    
    <!-- Vector control point handles -->
    <rect x="-40" y="-70" width="10" height="10" fill="#0047FF"/>
