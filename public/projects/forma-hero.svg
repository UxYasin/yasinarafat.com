<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#141519"/>
  <!-- Isometric flat wireframe grid -->
  <defs>
    <pattern id="iso" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 60 M 0 0 L 60 60" fill="none" stroke="#222530" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#iso)"/>
  
  <!-- Floating planar UI windows in perspective -->
  <g transform="translate(600, 390)">
    <!-- Main spatial frame -->
    <rect x="-240" y="-160" width="480" height="320" rx="4" fill="#1A1C24" stroke="#0047FF" stroke-width="2"/>
    <line x1="-240" y1="-120" x2="240" y2="-120" stroke="#292D3D" stroke-width="1"/>
    <circle cx="-210" cy="-140" r="4" fill="#0047FF"/>
    <circle cx="-190" cy="-140" r="4" fill="#3D4257"/>
    <circle cx="-170" cy="-140" r="4" fill="#3D4257"/>
    <text x="210" y="-136" text-anchor="end" font-family="monospace" font-size="10" fill="#717894">SPATIAL.OS // v3.4</text>
    
    <!-- Secondary offset glass plane -->
    <rect x="-160" y="-80" width="320" height="200" rx="2" fill="#202330" stroke="#FAF9F5" stroke-width="1" opacity="0.95"/>
    <line x1="-120" y1="-30" x2="120" y2="-30" stroke="#373D54" stroke-width="2"/>
    <line x1="-120" y1="0" x2="60" y2="0" stroke="#373D54" stroke-width="2"/>
    <line x1="-120" y1="30" x2="90" y2="30" stroke="#0047FF" stroke-width="3"/>
    
    <!-- Coordinate ticks -->
    <line x1="-260" y1="0" x2="-250" y2="0" stroke="#0047FF" stroke-width="2"/>
    <line x1="250" y1="0" x2="260" y2="0" stroke="#0047FF" stroke-width="2"/>
    <line x1="0" y1="-180" x2="0" y2="-170" stroke="#0047FF" stroke-width="2"/>
    <line x1="0" y1="170" x2="0" y2="180" stroke="#0047FF" stroke-width="2"/>
  </g>
  
  <text x="80" y="100" font-family="monospace" font-size="11" fill="#0047FF" letter-spacing="3">FORMA SPATIAL OS // PROTOTYPE CANVAS</text>
  <text x="1120" y="720" text-anchor="end" font-family="monospace" font-size="11" fill="#848CA8" letter-spacing="2">ZERO CHROME / FLAT VECTOR PHYSICS</text>
</svg>
