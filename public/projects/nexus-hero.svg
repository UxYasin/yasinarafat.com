<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#0B0C0E"/>
  <circle cx="600" cy="400" r="280" fill="none" stroke="#1C1E24" stroke-width="1"/>
  <circle cx="600" cy="400" r="180" fill="none" stroke="#262A33" stroke-width="1" stroke-dasharray="6 6"/>
  
  <!-- Topological continuous ribbon (Nexus) -->
  <g transform="translate(600, 400)">
    <path d="M -160 120 L -60 -120 L 60 120 L 160 -120" fill="none" stroke="#0047FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -160 -120 L -60 120 L 60 -120 L 160 120" fill="none" stroke="#FAF9F5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Intersection anchors -->
    <circle cx="0" cy="0" r="14" fill="#0047FF"/>
    <circle cx="0" cy="0" r="6" fill="#FAF9F5"/>
  </g>
  
  <text x="100" y="120" font-family="monospace" font-size="11" fill="#717684" letter-spacing="3">NEXUS GLOBAL CAPITAL // ZURICH · LONDON · SINGAPORE</text>
  <text x="100" y="700" font-family="monospace" font-size="11" fill="#0047FF" letter-spacing="2">ASSET UNDER MGMT: $2.4B</text>
  <text x="1100" y="700" text-anchor="end" font-family="monospace" font-size="11" fill="#FAF9F5" letter-spacing="2">TOPOLOGICAL MARK DESIGN</text>
</svg>
