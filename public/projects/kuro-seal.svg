<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#141414"/>
  <defs>
    <radialGradient id="brassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#brassGlow)"/>

  <!-- Minimal Millimeter Grid -->
  <g stroke="#262626" stroke-width="0.5">
    <line x1="200" y1="100" x2="1000" y2="100"/>
    <line x1="200" y1="200" x2="1000" y2="200"/>
    <line x1="200" y1="300" x2="1000" y2="300"/>
    <line x1="200" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="500" x2="1000" y2="500"/>
    <line x1="200" y1="600" x2="1000" y2="600"/>
    <line x1="300" y1="50" x2="300" y2="650"/>
    <line x1="450" y1="50" x2="450" y2="650"/>
    <line x1="600" y1="50" x2="600" y2="650"/>
    <line x1="750" y1="50" x2="750" y2="650"/>
    <line x1="900" y1="50" x2="900" y2="650"/>
  </g>

  <!-- Brass Heat Deboss Stamp Mark -->
  <circle cx="600" cy="350" r="160" stroke="#C4A77D" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="600" cy="350" r="145" stroke="#C4A77D" stroke-width="3"/>
  <circle cx="600" cy="350" r="130" stroke="#C4A77D" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Stylized Kuro Seal Monogram -->
  <path d="M540 280 L660 280 M600 280 L600 420 M550 420 L650 420" stroke="#E6D3B3" stroke-width="8" stroke-linecap="square"/>
  <path d="M560 340 L530 380 M640 340 L670 380" stroke="#E6D3B3" stroke-width="6" stroke-linecap="square"/>

  <!-- Craft Details & Microcopy -->
  <text x="600" y="470" fill="#C4A77D" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="4">TOKYO BESPOKE // 黒</text>
  <text x="600" y="495" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SOLID BRASS DEBOSSING DIE • 0.8MM RELIEF</text>
  
  <text x="220" y="130" fill="#666666" font-family="monospace" font-size="10">TEMP: 160°C</text>
  <text x="220" y="150" fill="#666666" font-family="monospace" font-size="10">DWELL: 3.5 SEC</text>
  <text x="980" y="620" fill="#666666" font-family="monospace" font-size="10" text-anchor="end">CALIBRATION // 100% SCALE</text>
</svg>
