<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#0E0F12"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1B20" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)" />
  <!-- Editorial layout lines -->
  <line x1="120" y1="0" x2="120" y2="800" stroke="#22232A" stroke-width="1"/>
  <line x1="1080" y1="0" x2="1080" y2="800" stroke="#22232A" stroke-width="1"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#22232A" stroke-width="1"/>
  <line x1="0" y1="680" x2="1200" y2="680" stroke="#22232A" stroke-width="1"/>
  
  <!-- Generative Harmonic Circles / Cellular geometry -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#252733" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#0047FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FAF9F5" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#0047FF"/>
    
    <!-- Harmonic tangent rings -->
    <circle cx="-100" cy="0" r="60" fill="none" stroke="#0047FF" stroke-width="1" opacity="0.6"/>
    <circle cx="100" cy="0" r="60" fill="none" stroke="#0047FF" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="-100" r="60" fill="none" stroke="#FAF9F5" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="100" r="60" fill="none" stroke="#FAF9F5" stroke-width="1" opacity="0.4"/>
    
    <!-- Crosshairs -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#2E303E" stroke-width="1"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#2E303E" stroke-width="1"/>
  </g>
  
  <!-- Typographic telemetry labels -->
  <text x="140" y="160" font-family="monospace" font-size="12" fill="#0047FF" letter-spacing="3">FIG. 01 // SYNTHETIC CELLULAR TOPOLOGY</text>
  <text x="140" y="650" font-family="monospace" font-size="12" fill="#6B6E7E" letter-spacing="2">SPEC: NEURAL BIOWARE / GEN. 04</text>
  <text x="1060" y="650" text-anchor="end" font-family="monospace" font-size="12" fill="#FAF9F5" letter-spacing="2">AURORA SYNTHETICS</text>
</svg>
