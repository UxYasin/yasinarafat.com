<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#0A0B0D"/>
  
  <!-- CRT Matrix Scanlines -->
  <g opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#0047FF" stroke-width="1"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#0047FF" stroke-width="1"/>
  </g>
  
  <!-- Isometric Voxel Matrix -->
  <g transform="translate(600, 400)">
    <!-- Base block -->
    <polygon points="0,-120 140,-40 0,40 -140,-40" fill="#181B24" stroke="#0047FF" stroke-width="2"/>
    <polygon points="-140,-40 0,40 0,200 -140,120" fill="#10121A" stroke="#0047FF" stroke-width="2"/>
    <polygon points="140,-40 0,40 0,200 140,120" fill="#0D0F15" stroke="#0047FF" stroke-width="2"/>
    
    <!-- Floating core voxel -->
    <polygon points="0,-220 70,-180 0,-140 -70,-180" fill="#0047FF"/>
    <polygon points="-70,-180 0,-140 0,-60 -70,-100" fill="#0035BE"/>
    <polygon points="70,-180 0,-140 0,-60 70,-100" fill="#002999"/>
  </g>
  
  <text x="120" y="140" font-family="monospace" font-size="11" fill="#0047FF" letter-spacing="3">VOXEL COMPUTATION PROTOCOL // CONSENSUS V4</text>
  <text x="120" y="680" font-family="monospace" font-size="11" fill="#6B7280" letter-spacing="2">ACTIVE NODES: 42,819 // SHARD ID: 0x9AF</text>
</svg>
