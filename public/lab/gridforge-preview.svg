<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0C0D10"/>
  <!-- Tangent Geometry grid -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#222530" stroke-width="1"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#0047FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="53" fill="none" stroke="#FAF9F5" stroke-width="2"/>
    <circle cx="0" cy="0" r="33" fill="#0047FF"/>
    
    <!-- Golden ratio arcs -->
    <path d="M -140 0 A 140 140 0 0 1 0 -140" fill="none" stroke="#0047FF" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 0 -140 A 86 86 0 0 1 86 0" fill="none" stroke="#FAF9F5" stroke-width="1.5"/>
    
    <!-- Crosshairs & angles -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#2B2F3D" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#2B2F3D" stroke-width="1"/>
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#0047FF" stroke-width="0.8" opacity="0.6"/>
  </g>
  <text x="50" y="60" font-family="monospace" font-size="11" fill="#0047FF" letter-spacing="2">GRIDFORGE // 1.618 HARMONIC ENGINE</text>
  <text x="50" y="450" font-family="monospace" font-size="10" fill="#717688" letter-spacing="1">WASM VECTOR TANGENTS COMPUTED REALTIME</text>
</svg>
